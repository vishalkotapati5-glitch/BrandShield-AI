services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brandshield
      POSTGRES_PASSWORD: brandshield
      POSTGRES_DB: brandshield
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandshield"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbdata:
